name: "Feng-Yuan (Frey) Liu"
title: "PhD researcher in astronomy · Mary Brück Scholar"
institution: "Institute for Astronomy, University of Edinburgh"
email: "Fengyuan.Liu@ed.ac.uk"
photo: avatarsmall.jpeg
links:
  google_scholar: ""
  github: "https://github.com/freyfyliu"
  researchgate: ""
  orcid: "https://orcid.org/0000-0003-1386-3676"
  twitter: ""
  linkedin: ""
  cv: "papers/Frey_Liu_CV_2026.pdf"
accent_color: "#325b83"
dark_mode: true
math: false
description: "Frey Liu studies how galaxies grew, formed stars, and hid some of that star formation behind cosmic dust."
url: ""
baseurl: ""
analytics:
  google_id: ""
  plausible_domain: ""
  umami_website_id: ""
  umami_src: ""
  goatcounter: ""
nav_pages:
  - name: about
  - name: research
  - name: publications
  - name: talks
  - name: teaching
  - name: outreach
  - name: gallery
  - name: blog
    label: Field Notes
scholar:
  last_name: Liu
  first_name: ["F.-Y.", "Feng-Yuan"]
  style: citesty
  locale: en
  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending
  replace_strings: true
  join_strings: true
  query: "@*"
  bibliography_list_attributes:
    reversed: "reversed"
  bibtex_skip_fields: [abstract, month_numeric, file, selected, code, slides, video, poster, data]
permalink: /blog/:year/:title/
include:
  - _pages
sass:
  style: compressed
  quiet_deps: true
  silence_deprecations: [import]
  sourcemap: development
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true
plugins: ["jekyll/scholar", "jekyll-sitemap"]
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTENT_NOTES.md
  - UPGRADING.md
  - LICENSE
  - setup.sh
  - images/screenshots
  - vendor
  - .bundle
  - node_modules
